{% extends 'learning_logs/base.html' %}

{% block content %}
   
    <p>Tópico: {{ topic }}<p>

    <p>Anotações: </p>

    <p>
        <a href="{% url 'learning_logs:new_entry' topic.id %}">Adicionar Nova Anotação</a>
    
    </p>

    <ul>
        {% for entry in entries %}

        <li>
            <p>{{ entry.date_added|date:"M d, Y H:i" }}</p>
            <p>{{ entry.text|linebreaks }}</p>
            <p>
                <a href="{% url 'learning_logs:edit_entry' entry.id %}">Editar anotação</a>
            </p>
        </li>
        {% endfor %}
    </ul>
{% endblock content %}
