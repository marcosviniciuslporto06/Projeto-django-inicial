{% extends "learning_logs/base.html" %}
{% load bootstrap3 %}

{% block header %}
  <h2>Adicione um novo Tópico:</h2>
{% endblock header %}



{% block content %}
    <p>Adicione um novo Tópico:</p>
  
    <form action="{% url 'learning_logs:new_topic' %}"method= 'post' class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% buttons %}
             <button name="submit" class="btn btn-primary">Adicionar</button>
        {% endbuttons %}
    </form>


{% endblock content %}
